<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Couverture masterclass</title>
<style>
  @font-face { font-family: "Instrument Serif"; src: url("/assets/InstrumentSerif-Regular.ttf"); font-style: normal; font-display: block; }
  @font-face { font-family: "Instrument Serif"; src: url("/assets/InstrumentSerif-Italic.ttf"); font-style: italic; font-display: block; }
  @font-face { font-family: "Inter"; src: url("/assets/Inter-Variable.ttf"); font-weight: 100 900; font-display: block; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Couverture « Qui sommes-nous ? » — meme monde papier que le film.
// La grille du profil recadre en 3:4 (y 240 → 1680) : tout l'essentiel y tient.
const W = 1080, H = 1920;
const PAPER = "#F3EEE6", INK = "#14161A", GREY = "#8E877E", RULE = "#CEC6BA",
      RED = "#7A2C25", GOLD = "#A8812E";
const c = document.getElementById("c"), ctx = c.getContext("2d");

function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let x = s;
  x = Math.imul(x ^ (x >>> 15), x | 1); x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
  return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }

function paper() {
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H * 0.45, H * 0.2, W / 2, H * 0.5, H * 0.75);
  g.addColorStop(0, "rgba(255,255,255,0.0)"); g.addColorStop(1, "rgba(120,100,80,0.16)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const r = rng(7), img = ctx.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * 10; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  ctx.putImageData(img, 0, 0);
}

function spaced(text, x, y, sp, align = "left") {
  let w = 0; for (const ch of text) w += ctx.measureText(ch).width + sp; w -= sp;
  let cx = align === "right" ? x - w : align === "center" ? x - w / 2 : x;
  for (const ch of text) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + sp; }
  return w;
}

// trait d'encre : epaisseur qui respire, comme a la plume
function inkLine(pts, w, color) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (let i = 1; i < pts.length; i++) {
    const k = i / pts.length;
    ctx.lineWidth = w * (0.75 + 0.35 * Math.sin(k * Math.PI));
    ctx.beginPath(); ctx.moveTo(...pts[i - 1]); ctx.lineTo(...pts[i]); ctx.stroke();
  }
  ctx.restore();
}

function draw() {
  paper();
  const M = 92;

  // --- en-tete
  ctx.fillStyle = INK; ctx.font = '600 30px "Inter"'; ctx.textBaseline = "alphabetic";
  const wName = spaced("COMPOUND CAPITAL", M, 330, 4.2);
  ctx.fillStyle = GOLD; ctx.fillRect(M, 356, wName, 4);
  ctx.fillStyle = RULE; ctx.fillRect(M + wName, 357, W - 2 * M - wName, 2);
  ctx.fillStyle = GREY; ctx.font = '500 28px "Inter"';
  spaced("MASTERCLASS · 2 MIN", W - M, 330, 3.2, "right");

  // --- titre
  ctx.fillStyle = INK;
  ctx.font = '208px "Instrument Serif"';
  ctx.fillText("Qui", M - 6, 600);
  ctx.fillText("sommes-", M - 6, 790);
  ctx.font = 'italic 208px "Instrument Serif"'; ctx.fillStyle = RED;
  const wn = ctx.measureText("nous").width;
  ctx.fillText("nous", M - 6, 980);
  ctx.font = '208px "Instrument Serif"'; ctx.fillStyle = INK;
  ctx.fillText("?", M - 6 + wn + 30, 980);   // espace fine avant « ? »

  // soulignement a la plume sous « nous »
  const ul = []; for (let i = 0; i <= 40; i++) { const x = M + i / 40 * (wn - 10);
    ul.push([x, 1012 + Math.sin(i / 40 * Math.PI * 1.3) * 7 - i * 0.12]); }
  inkLine(ul, 7, RED);

  // --- sous-titre
  ctx.fillStyle = INK; ctx.font = '400 46px "Inter"';
  ctx.fillText("Un algorithme qui décide à froid,", M, 1118);
  ctx.fillText("à ta place.", M, 1180);
  ctx.fillStyle = GREY;
  ctx.fillText("Tout expliqué, simplement.", M, 1242);

  // --- le trait : l'emotion zigzague, la regle monte calmement
  const x0 = M, x1 = W - M, yb = 1560, top = 1330;
  ctx.fillStyle = RULE; ctx.fillRect(x0, yb, x1 - x0, 2);
  const r = rng(11), emo = [];
  for (let i = 0; i <= 26; i++) { const k = i / 26; emo.push([x0 + k * (x1 - x0) * 0.62,
    yb - 95 - Math.sin(k * 9.5) * 48 * (0.6 + r()) + k * 30]); }
  ctx.save(); ctx.setLineDash([3, 14]); ctx.globalAlpha = 0.85;
  ctx.strokeStyle = RED; ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.beginPath();
  emo.forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p)); ctx.stroke(); ctx.restore();

  const calm = [];
  for (let i = 0; i <= 60; i++) { const k = i / 60; calm.push([x0 + k * (x1 - x0 - 40),
    yb - 40 - Math.pow(k, 1.35) * (yb - top - 40) + Math.sin(k * 22) * 6 * (1 - k)]); }
  inkLine(calm, 9, INK);
  const end = calm[calm.length - 1];
  ctx.fillStyle = GOLD; ctx.beginPath(); ctx.arc(end[0], end[1], 15, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(168,129,46,0.35)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(end[0], end[1], 30, 0, Math.PI * 2); ctx.stroke();

  ctx.font = '500 26px "Inter"'; ctx.fillStyle = RED; ctx.globalAlpha = 0.9;
  spaced("TES ÉMOTIONS", x0, yb + 50, 2.6);
  ctx.fillStyle = INK; ctx.globalAlpha = 1;
  spaced("L'ALGORITHME", x1, yb + 50, 2.6, "right");

  // --- pied (hors grille 3:4, visible en plein ecran)
  ctx.textAlign = "center";
  ctx.font = 'italic 50px "Instrument Serif"'; ctx.fillStyle = GREY;
  ctx.fillText("Comprendre avant de décider.", W / 2, 1765);
  ctx.textAlign = "left";
}

window.READY = (async () => {
  await Promise.all([document.fonts.load('100px "Instrument Serif"'), document.fonts.load('italic 100px "Instrument Serif"'),
    document.fonts.load('400 40px "Inter"'), document.fonts.load('600 40px "Inter"'), document.fonts.load('500 40px "Inter"')]);
  draw(); return c.toDataURL("image/png");
})();
</script>
</body>
</html>
